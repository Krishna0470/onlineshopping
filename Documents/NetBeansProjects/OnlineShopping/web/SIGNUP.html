<!DOCTYPE html>
<html>
    <head>
        <title>SIGN UP</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="signin.css">
    </head>
    <body>
        
        <section class="signup">
    <div class="containersigup">
        <p class="headlinesig">Sign Up</p>

        <form action="DBUtil" method="post">
  
    <input type="hidden" name="action" value="save" />

    <div>
        <div class="boxsig">
            <p>Username</p>
            <div><input type="text" placeholder="Enter your Username" name="username" required></div>
        </div>
    </div>

    <div>
        <div class="boxsig">
            <p>Email</p>
            <div><input type="email" placeholder="Enter your Email" name="email" required></div>
        </div>
    </div>

    <div>
        <div class="boxsig">
            <p>Password</p>
            <div><input type="password" placeholder="Enter your Password" name="password" required></div>
        </div>
    </div>

    <div>
        <div class="boxsig">
            <p>Confirm Password</p>
            <div><input type="password" placeholder="Confirm your Password" name="confirmPassword" required></div>
        </div>
    </div>

    <button class="signupBtn" type="submit">Sign Up</button>
    <p class="text">Already have an account? <a href="SIGNIN.html">Sign in</a></p>
</form>

    </div>
</section>
    </body>
</html>
